[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-event-harvester"
version = "0.1.0a0"
description = "A provider-independent, zero-paid-API crypto event scraping pilot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "beautifulsoup4>=4.12,<5",
]

[project.optional-dependencies]
playwright = ["playwright>=1.50,<2"]
selenium = ["selenium>=4.25,<5"]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[project.scripts]
crypto-harvester = "crypto_event_harvester.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
