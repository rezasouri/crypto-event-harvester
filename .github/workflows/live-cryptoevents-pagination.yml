name: CryptoEvents checkpointed pagination (nonblocking)

on:
  pull_request:
    paths:
      - 'src/crypto_event_harvester/pagination.py'
      - 'src/crypto_event_harvester/cryptoevents_backfill.py'
      - 'src/crypto_event_harvester/cli.py'
      - '.github/workflows/live-cryptoevents-pagination.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paginate:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e .
      - name: Run initial bounded crawl and resume from saved offset
        run: |
          START_DAY="$(date -u +%F)"
          crypto-harvester cryptoevents-backfill --db artifacts/harvest.sqlite \
            --start-date "$START_DAY" --pages 2 --output artifacts/crawl-first.json
          crypto-harvester cryptoevents-backfill --db artifacts/harvest.sqlite \
            --start-date "$START_DAY" --pages 2 --output artifacts/crawl-resume.json
          python - <<'PY'
          import json
          from pathlib import Path
          from crypto_event_harvester.storage import list_events, store_status

          first = json.loads(Path("artifacts/crawl-first.json").read_text(encoding="utf-8"))
          resumed = json.loads(Path("artifacts/crawl-resume.json").read_text(encoding="utf-8"))
          rows = list_events("artifacts/harvest.sqlite", provider="cryptoevents", limit=1000)
          events = [row["event"] for row in rows]

          assert first["requests"]["homepage_gets"] == 1
          assert first["requests"]["total"] <= 2
          assert resumed["requests"]["homepage_gets"] == 0
          assert resumed["requests"]["total"] <= 2
          assert len(events) >= 30
          assert len({item["event_id"] for item in events}) == len(events)
          assert all(item["provider"] == "cryptoevents" for item in events)
          assert all(item["schema_version"] == "1.1" for item in events)
          assert all(item["start_at_utc"] is None for item in events)
          assert all(item["source_url"].startswith("https://cryptoevents.global/") for item in events)

          db = store_status("artifacts/harvest.sqlite")
          assert db["events"] == len(events)
          summary = {
              "source": "cryptoevents",
              "first_run_requests": first["requests"],
              "resume_run_requests": resumed["requests"],
              "first_run_pages": first["pages_this_run"],
              "resume_run_pages": resumed["pages_this_run"],
              "total_pages": resumed["total_pages"],
              "unique_events": len(events),
              "explicit_date_events": sum(item["start_date"] is not None for item in events),
              "db_events": db["events"],
              "paid_api_calls": 0,
          }
          Path("artifacts/pagination-report.json").write_text(
              json.dumps(summary, indent=2), encoding="utf-8"
          )
          print(json.dumps(summary, indent=2))
          PY
      - name: Upload checkpointed pagination proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cryptoevents-checkpointed-pages
          path: |
            artifacts/crawl-first.json
            artifacts/crawl-resume.json
            artifacts/pagination-report.json
            artifacts/harvest.sqlite
          if-no-files-found: warn
