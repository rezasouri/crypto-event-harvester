name: Live source feasibility (nonblocking)

on:
  pull_request:
    paths:
      - 'src/crypto_event_harvester/**'
      - '.github/workflows/live-source-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  http-source-probes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e .
      - name: Three bounded HTTP listing probes
        run: |
          crypto-harvester sources --source all --engine http --timeout 12 \
            --json-out artifacts/live-source-feasibility.json
          python -m json.tool artifacts/live-source-feasibility.json
      - name: Attach machine-readable evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crypto-source-probe-report
          path: artifacts/live-source-feasibility.json
          if-no-files-found: warn
