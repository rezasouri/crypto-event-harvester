name: Inspect CryptoEvents pagination (temporary diagnostic)
on:
  pull_request:
    paths:
      - 'scripts/inspect_cryptoevents_pagination.py'
      - '.github/workflows/inspect-cryptoevents-pagination.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install httpx beautifulsoup4
      - run: python scripts/inspect_cryptoevents_pagination.py
