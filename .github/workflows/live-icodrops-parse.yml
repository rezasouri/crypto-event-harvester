name: ICO Drops live extraction (nonblocking)

on:
  pull_request:
    paths:
      - 'src/crypto_event_harvester/providers/**'
      - 'src/crypto_event_harvester/cli.py'
      - '.github/workflows/live-icodrops-parse.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e .
      - name: Extract public upcoming and ended round listings
        run: |
          crypto-harvester scrape --provider icodrops --section upcoming --min-events 20 \
            --output artifacts/icodrops-upcoming.json
          crypto-harvester scrape --provider icodrops --section ended --min-events 20 \
            --output artifacts/icodrops-ended.json
          python - <<'PY'
          import json
          from pathlib import Path
          for filename in sorted(Path("artifacts").glob("icodrops-*.json")):
              p = json.loads(filename.read_text())
              print(filename, "extracted_count=", p["extracted_count"])
              print("sample =", json.dumps(p["events"][:2], ensure_ascii=False))
          PY
      - name: Upload sanitized normalized event records
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: icodrops-real-extracted-events
          path: artifacts/icodrops-*.json
          if-no-files-found: warn
