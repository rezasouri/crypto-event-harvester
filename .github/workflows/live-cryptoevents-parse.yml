name: CryptoEvents.global live extraction (nonblocking)

on:
  pull_request:
    paths:
      - 'src/crypto_event_harvester/providers/cryptoevents.py'
      - 'src/crypto_event_harvester/cli.py'
      - '.github/workflows/live-cryptoevents-parse.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e .
      - name: Extract real conference event cards via one HTTP request
        run: |
          crypto-harvester scrape --provider cryptoevents --section upcoming \
            --min-events 10 --output artifacts/cryptoevents.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("artifacts/cryptoevents.json").read_text())
          events = payload["events"]
          assert payload["extracted_count"] == len(events)
          assert len({event["event_id"] for event in events}) == len(events)
          assert all(event["source_url"].startswith("https://cryptoevents.global/") for event in events)
          dated = sum(event["start_date"] is not None for event in events)
          print("Extracted conferences:", len(events), "with explicit start date:", dated)
          print("Samples:", json.dumps(events[:3], ensure_ascii=False))
          PY
      - name: Upload real extracted conference records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cryptoevents-real-extracted-events
          path: artifacts/cryptoevents.json
          if-no-files-found: warn
